# =====================================================================
# Voluntiva — ambiente completo local
#
#   docker compose up --build
#
#   http://localhost:8080        interface web (nginx -> /api e /ws)
#   http://localhost:8000/docs   API REST (Swagger)
#   localhost:5050               servidor VAP (TCP)
#   localhost:5433               PostgreSQL (usuário voluntiva / senha voluntiva)
#
# O banco é criado na primeira subida: migrations 0001-0004, senha de
# desenvolvimento do papel voluntiva_app e seed com contas de teste
# (db/dev/9100_seed_dev.sql, senha "voluntiva123").
# Para recriar do zero:  docker compose down -v && docker compose up --build
#
# Somente desenvolvimento: senhas e segredo JWT abaixo são públicos.
# =====================================================================

name: voluntiva

x-backend-env: &backend-env
  APP_ENV: development
  # O backend conecta com o papel da aplicação, não com o superusuário:
  # assim as policies de RLS da migration 0003 valem de verdade.
  DATABASE_URL: postgresql+psycopg://voluntiva_app:voluntiva_app_dev@db:5432/voluntiva
  JWT_SECRET: ${JWT_SECRET:-dev-local-apenas-nao-usar-em-producao-0123456789}
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  FUSO_HORARIO: America/Sao_Paulo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voluntiva
      POSTGRES_PASSWORD: voluntiva
      POSTGRES_DB: voluntiva
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      # Executados em ordem alfabética só na criação do volume.
      - ./db/migrations/0001_voluntiva_schema.sql:/docker-entrypoint-initdb.d/0001_voluntiva_schema.sql:ro
      - ./db/migrations/0002_codigo_publico_acao.sql:/docker-entrypoint-initdb.d/0002_codigo_publico_acao.sql:ro
      - ./db/migrations/0003_rls_papel_app.sql:/docker-entrypoint-initdb.d/0003_rls_papel_app.sql:ro
      - ./db/migrations/0004_causa.sql:/docker-entrypoint-initdb.d/0004_causa.sql:ro
      - ./db/dev/9000_papel_app_dev.sql:/docker-entrypoint-initdb.d/9000_papel_app_dev.sql:ro
      - ./db/dev/9100_seed_dev.sql:/docker-entrypoint-initdb.d/9100_seed_dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voluntiva -d voluntiva"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  vap:
    build: ./backend
    command: ["python", "-m", "protocol"]
    environment:
      <<: *backend-env
      # 0.0.0.0: dentro do container, 127.0.0.1 não aceita conexões de fora.
      VAP_HOST: 0.0.0.0
      VAP_PORT: "5050"
    ports:
      - "5050:5050"
    # O healthcheck da imagem testa a API HTTP, que não roda neste container.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dados:
